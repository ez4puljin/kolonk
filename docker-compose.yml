# Хавтасны нэр кирилл тул төслийн нэрийг тодорхой зааж өгнө.
name: kolonk

services:
  db:
    # Локал хөгжүүлэлтийн Postgres 17-ийн dump-тай нийцүүлж 17 барина.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolonk
      POSTGRES_USER: kolonk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolonk -d kolonk"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: ["dev"]
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/code
      - backups:/backups
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  api-prod:
    profiles: ["prod"]
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      - backups:/backups
      # Ээлжийн зураг зэрэг хавсралтууд — rebuild хийхэд устахгүй.
      - uploads:/code/uploads
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: arq app.worker.WorkerSettings
    volumes:
      - ./backend:/code
      - backups:/backups
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-prod

volumes:
  pgdata: {}
  redisdata: {}
  backups: {}
  uploads: {}
