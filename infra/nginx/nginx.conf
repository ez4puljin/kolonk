server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker-ийн дотоод DNS. nginx нь `proxy_pass http://api-prod:8000` гэж
    # ШУУД бичсэн үед хостын нэрийг ЗӨВХӨН асах үедээ нэг л удаа шийддэг.
    # `docker compose up -d` хийхэд api-prod дахин үүсэж ШИНЭ IP авдаг тул
    # nginx хуучин хаяг руугаа ярьсаар 502 буцаадаг байв — бүх API чимээгүй
    # унана. Хувьсагчаар дамжуулснаар nginx хүсэлт бүрд дахин шийднэ.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream api-prod;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare Tunnel-ээр орж ирэхэд хэрэглэгчийн жинхэнэ IP энд байна —
        # нэвтрэлтийн хамгаалалт үүгээр оролдлогыг тоолно.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        set $ws_upstream api-prod;
        proxy_pass http://$ws_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 3600s;
    }

    # Vite-ийн гаргасан файлууд нэрэндээ агуулгын хэшийг агуулдаг тул
    # хэзээ ч өөрчлөгдөхгүй — удаан хугацаагаар кэшилж болно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html-г ХЭЗЭЭ Ч кэшлэхгүй. Энэ файл л шинэ bundle-ийн нэрийг
    # заадаг тул кэшлэгдвэл хэрэглэгч deploy хийсний дараа ч хуучин
    # хувилбар дээрээ гацна — гар утсанд ялангуяа мэдэгдэхгүй өнгөрдөг.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
